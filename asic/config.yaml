# Manual hold fix for the SPI input shift register (i_core.u_spi.u_spi.in_shift,
# instances named _23641_ through _23673_ in the post-synthesis netlist): each
# bit's D pin is fed by a small mux (hold-feedback or shift-in from the
# neighboring bit) with near-zero combinational delay, so clock-tree skew
# between sclk leaf buffers dominates and produces hold violations -- real
# even at the typ corner (worst-case slack only +0.048ns on full-test-v5,
# before this fix) and confirmed negative at the fast corner (worst -0.054ns,
# 31 endpoints, see runs/full-test-v5/50-openroad-stapostpnr/*/violator_list.rpt).
# repair_timing -hold (PL_/GRT_RESIZER_HOLD_SLACK_MARGIN) cannot close this: it
# plateaus at the same ~-0.05ns residual regardless of margin (tested 0.2
# through 2.0, the latter causing a non-convergent runaway with 11000+ useless
# buffer insertions), and repeated calls report "No hold violations found"
# despite find_timing_paths independently confirming a real violation --
# detection isn't the issue (no wire-length-style blind spot here, unlike
# DESIGN_REPAIR_MAX_WIRE_LENGTH above), the resizer just won't push further on
# this topology. One sg13cmos5l_dlygate4sd3_1 (purpose-built PDK hold-delay
# cell, ~0.24-0.5ns depending on load) inserted on each violating D pin adds
# comfortable positive margin at every corner, well within the 100ns sclk
# period. Regenerate this list if the shift register's synthesis instance
# names change (e.g. after a VHDL_FILES or synthesis-tool change).
INSERT_ECO_BUFFERS:
  - target: "_23641_/D"
    buffer: sg13cmos5l_dlygate4sd3_1
  - target: "_23642_/D"
    buffer: sg13cmos5l_dlygate4sd3_1
  - target: "_23643_/D"
    buffer: sg13cmos5l_dlygate4sd3_1
