# Full chip (pad ring + bondpads) of hdc_word40_top for IHP SG13CMOS5L:
# D=1000, SPI interface. The D=10000 / UART version is config_d10000.yaml.
# Based on https://github.com/IHP-GmbH/ihp-sg13-librelane-template (librelane/, 40ca8b9).
meta:
  version: 3
  flow: Chip
  substituting_steps:
    # VHDL instead of Verilog (same substitutions as the VHDLClassic flow)
    Verilator.Lint: null
    Checker.LintTimingConstructs: null
    Checker.LintErrors: null
    Checker.LintWarnings: null
    Yosys.JsonHeader: null
    Yosys.Synthesis: Yosys.VHDLSynthesis
    Odb.SetPowerConnections: null   # needs the JSON header; see PDN_MACRO_CONNECTIONS
    Odb.WriteVerilogHeader: null
    Yosys.EQY: null

    # Magic DRC and Netgen LVS disabled (slow and inaccurate); LVS runs in
    # KLayout instead, against a CDL written by OpenROAD from the final odb.
    Magic.DRC: null
    Checker.MagicDRC: null
    Magic.SpiceExtraction: null
    Checker.IllegalOverlap: null
    +OpenROAD.IRDropReport: OpenROAD.WriteCDL
    Netgen.LVS: KLayout.LVS

    # GDS comes from KLayout; Magic's stream-out (only used for the XOR
    # check) has an offset on the SRAMs.
    Magic.StreamOut: null
    KLayout.XOR: null
    Checker.XOR: null

    # ECO antenna diodes on the SRAM inputs (INSERT_ECO_DIODES), right after
    # global routing and *before* post-GRT design repair, so repair sees the
    # diode load (inserted later, they caused most post-route slew violations
    # on the shared SRAM address/data nets). Legalized and incrementally
    # re-routed by the step.
    +OpenROAD.CheckAntennas: Odb.InsertECODiodes

    # ECO hold buffers on the SPI input shift register (INSERT_ECO_BUFFERS),
    # right after post-GRT resizer timing repair and before detailed routing,
    # so DetailedRouting routes their nets normally. repair_timing -hold
    # already runs here (PL_/GRT_RESIZER_HOLD_SLACK_MARGIN) but plateaus well
    # short of closing these: confirmed standalone (same GRT-stage parasitics)
    # that repeated repair_timing -hold calls, even at a much larger margin,
    # report "No hold violations found" while find_timing_paths independently
    # shows real negative slack remaining -- an OpenROAD resizer limitation on
    # this topology, not a margin problem. See INSERT_ECO_BUFFERS below.
    +OpenROAD.ResizerTimingPostGRT: Odb.InsertECOBuffers

DESIGN_NAME: hdc_chip_top

# asic/rtl replaces the FPGA memory files from the repo root.
VHDL_FILES:
  - dir::rtl/sg13_sram_macro.vhdl
  - dir::rtl/sram_array.vhdl
  - dir::rtl/sram_w40.vhdl
  - dir::rtl/IdentityMemory.vhdl
  - dir::rtl/ContinuousMemory.vhdl
  - dir::rtl/AssociativeMemory.vhdl
  - dir::rtl/ClassCounterRAM.vhdl
  - dir::../Accelerator.vhdl
  - dir::../spi_slave.vhdl
  - dir::../hdc_spi_loader.vhdl
  - dir::../hdc_cmd_loader.vhdl
  - dir::../hdc_word40_top.vhdl
  - dir::rtl/hdc_chip_top.vhdl
GHDL_ARGUMENTS: ["--std=08"]

# Keeps the port-less power pads through synthesis
EXTRA_VERILOG_MODELS:
  - dir::rtl/pad_keep.v

PRIMARY_GDSII_STREAMOUT_TOOL: klayout
KLAYOUT_CONFLICT_RESOLUTION: SkipNewCell

# Pad ring. Signal pads sit on the west/east sides, level with the logic
# channel between the two SRAM rows. pdngen only connects the core ring to
# the pad ring on west/east, so core supply pairs 2/3 are placed there.
# spare*_pad: unused IOPadIn cells. Each adds a vdd-tied gate to the IO ring's
# vdd rail net, which keeps that net's antenna ratio (rail area / gate area,
# Ant.e_Metal3/4/TopMetal1) below 20000. The 4440x2350 D=10000 die needed
# >= 10 IOPadIn; the ratio scales with the ring perimeter, so this 2400x2000
# die should need ~7. 5 functional + 5 spare = 10 keeps the old margin
# (estimate, not yet checked by a run).
PAD_SOUTH: [vdd0_pad, vss0_pad, iovdd_pad]
PAD_EAST: [miso_pad, spare3_pad, vdd3_pad, mosi_pad, vss3_pad, spare4_pad, led_pad]
PAD_NORTH: [iovss_pad, vdd1_pad, vss1_pad]
PAD_WEST: [rstn_pad, spare0_pad, vdd2_pad, clk_pad, spare1_pad, vss2_pad, sclk_pad, spare2_pad, cs_n_pad]

# Bondpad generated with the PDK's bondpad.py (ip/bondpad_70x70/gen_bondpad.py);
# PAD_BONDPAD_NAME/OFFSETS come from the PDK IO config (bondpad_70x70).
EXTRA_GDS:
  - dir::ip/bondpad_70x70/gds/bondpad_70x70.gds
EXTRA_LEFS:
  - dir::ip/bondpad_70x70/lef/bondpad_70x70.lef
IGNORE_DISCONNECTED_MODULES:
  - bondpad_70x70

# KLayout LVS. The schematic CDL needs every master: the SRAM macros (merged
# into one file, see cdl/merge_sram_cdl.py) and the device-less bondpad. The
# IO CDL is a copy without the broken (and unused) IOPadInOut30mA.
# lvs/sg13cmos5l_chip.lvs is the PDK deck with IO cells and SRAM macros
# compared as black boxes (their own PDK netlists don't match; lvs/hard_ip.rb).
PAD_CDLS:
  - dir::cdl/sg13cmos5l_io.cdl
EXTRA_CDLS:
  - dir::cdl/sram.cdl
  - dir::ip/bondpad_70x70/cdl/bondpad_70x70.cdl
KLAYOUT_LVS_SCRIPT: dir::lvs/sg13cmos5l_chip.lvs
KLAYOUT_LVS_OPTIONS:
  run_mode: deep

# SDC
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

# Core clock, 50 MHz (no UART divider any more, so G_CLK_FREQ_HZ is only
# informational). The SPI clocks sclk/cs_n (10 MHz) are defined in
# chip_top.sdc only; CTS builds trees for all SDC clocks.
CLOCK_PORT: pad_clk
CLOCK_NET: clk_pad/p2c
CLOCK_PERIOD: 20

# Floorplanning: two SRAM rows with pins facing a ~280um logic channel
# (6 macros, ~0.53 mm2; logic ~0.4 mm2 estimated from the D=10000 run).
FP_SIZING: absolute
DIE_AREA: [0, 0, 2400, 2000]
CORE_AREA: [365, 365, 2035, 1635]
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10

PL_TARGET_DENSITY_PCT: 40
GRT_ALLOW_CONGESTION: true

# Power Distribution Network (template settings)
PDN_CFG: dir::pdn_cfg.tcl
PDN_CORE_RING: True

# Match/overlap the SRAM PDN
PDN_HWIDTH: 6
PDN_HSPACING: 2.0
PDN_HOFFSET: 14

# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 15
PDN_CORE_RING_HWIDTH: 15
# Ensure minimum spacing for long metals
PDN_CORE_RING_VSPACING: 5
PDN_CORE_RING_HSPACING: 5

PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False

# Global power connections. Without the JSON header (VHDL flow) nothing
# ties the pad power pins to nets, so do it here for the RTL pads (*_pad),
# like SetPowerConnections does in the template. IO fillers/corners stay
# unconnected (rails connect by abutment). Pin patterns are anchored so
# that "vdd" does not also match "iovdd".
PDN_MACRO_CONNECTIONS:
  - "i_core.*u_macro.* VDD VSS VDD! VSS!"
  - "i_core.*u_macro.* VDD VSS VDDARRAY! VSS!"
  - ".*_pad VDD VSS ^vdd$ ^vss$"
  - ".*_pad IOVDD IOVSS ^iovdd$ ^iovss$"

# Design repair (slew/cap). Post-GPL repair only sees placement-estimated RC,
# and the post-route violations were mostly SRAM A_DOUT max-cap (lib limit
# 0.064 pF), SRAM input slew and clock-tree buffers. So: more headroom after
# placement, plus design and timing repair on global-routing parasitics
# (both off by default in the Classic/Chip flow).
#
# *_MAX_WIRE_LENGTH defaults to 0, which (per OpenROAD/LibreLane) disables
# repair_design's only buffer-insertion mechanism entirely, leaving it to
# fix slew/cap violations by upsizing the driver alone -- which cannot help
# when the driver is a fixed SRAM macro pin. Standalone repro against the
# post-GRT odb (openroad -exit, repair_design with the real libs/corners)
# confirmed: at 0 the SRAM A_DOUT[19] max-cap violator (the worst one, 0.097
# vs. 0.064 pF) and the A_WEN row-fanout slew violator are untouched (0
# buffers inserted anywhere, over the whole design, regardless of margin);
# with a nonzero length a buffer lands right at A_DOUT[19] splitting its two
# loads, and another splits the A_WEN fanout across the SRAM row -- the
# exact two violation patterns below. First tried at 300um: cut post-route
# max-cap violators from 22 to 4 and max-slew from 12 to 0-4 (by corner),
# but didn't fully clear them -- repair_design only ever buffers nets its
# length check flags as "too long", so a violator on a short/already-tight
# net is untouched regardless of margin. Lowered to 150 (smaller = more
# nets qualify as "too long" = more aggressive) to try to catch the rest;
# OpenROAD's own RC-optimal threshold for this library/corner is ~4675um,
# but that's a delay-optimality number, not the SRAM output's hard
# capacitance limit, so buffering well below it is still the correct fix.
DESIGN_REPAIR_MAX_SLEW_PCT: 30
DESIGN_REPAIR_MAX_CAP_PCT: 30
DESIGN_REPAIR_MAX_WIRE_LENGTH: 150
RUN_POST_GRT_DESIGN_REPAIR: true
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 20
GRT_DESIGN_REPAIR_MAX_CAP_PCT: 20
GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH: 150
RUN_POST_GRT_RESIZER_TIMING: true
# Hold margin against post-route clock skew: global routing sometimes sends a
# clock net around the bottom SRAM row (chip6: +1.5 mm, +0.33 ns skew, fast
# hold -0.2 ns), which pre-route hold repair can't see. Defaults 0.1 / 0.05.
# 0.3 wasn't enough on this chip either: signoff (post-DRT) hold WNS came in
# at -0.17/-0.20/-0.12 ns (typ/fast/slow) with it -- same "repair runs before
# the parasitics that actually cause the problem are known" gap as the
# slew/cap issue above, just with no equivalent post-route repair pass to
# fall back on. Raised to 0.5 to see if more pre-route headroom absorbs it.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.5
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.5

# Keep clock buffers off the SRAMs. (Clock leaf buffers drive ~20 flops each,
# which shows up as max-fanout, not slew, violations in the STA report.)
CTS_OBSTRUCTION_AWARE: true

# Antenna repair
DIODE_CELL: sg13cmos5l_antennanp/A
GRT_ANTENNA_REPAIR_ITERS: 5
GRT_ANTENNA_REPAIR_MARGIN: 30
DRT_ANTENNA_REPAIR_ITERS: 5
DRT_ANTENNA_REPAIR_MARGIN: 30

# KLayout antenna signoff with IHP-Open-PDK PR #990 (per-layer has_diode)
# ported to cmos5l; the deck needs its rule JSONs passed explicitly. Absolute
# paths: pdk_dir:: expands to a list, which this str-only option rejects.
KLAYOUT_ANTENNA_RUNSET: dir::drc/antenna_cmos5l_pr990.drc
KLAYOUT_ANTENNA_OPTIONS:
  drc_json_default: /scratch/IHP-Open-PDK/ihp-sg13cmos5l/libs.tech/klayout/tech/drc/rule_decks/sg13cmos5l_tech_default.json
  drc_json: /scratch/IHP-Open-PDK/ihp-sg13cmos5l/libs.tech/klayout/python/sg13cmos5l_pycell_lib/sg13cmos5l_tech_mod.json

# Tech LEF with the metal cumulative antenna ratio lowered 200 -> 195, so
# OpenROAD's checks/repairs keep a margin for the cell pins' own Metal1,
# which OpenROAD doesn't count but KLayout does (worst pin adds ~4).
TECH_LEFS:
  "nom_*": dir::lef/sg13cmos5l_tech_ant195.lef
  "min_*": dir::lef/sg13cmos5l_tech_ant195.lef
  "max_*": dir::lef/sg13cmos5l_tech_ant195.lef

# The stock PDK filler (default; RAM is no longer tight enough on this
# machine to need the flattened-macro deep-mode workaround in drc/filler/)
# left the two 800x800um density-check windows over the top SRAM row
# (counters/AM, y:800-1600) at 23.6-24.8% M2/M3 coverage vs. the 25% minimum
# (M2Fil.h/M3Fil.h, 4 errors, unchanged since the first full run): real
# routing there is only ~12-18%, and the stock 1.5um(M2)/2.0um(M3) filler-cell
# spacing can't pack enough filler into the rest to close a ~0.25-1.35%
# gap. drc/filler/sg13cmos5l_filler_Metal.lym tightens M2/M3 spacing to
# 0.5um (still above the M2fil.b/M3fil.b 0.42um minimum); confirmed via
# KLayout.Filler + KLayout.Density standalone on full-test-v5's post-route
# GDS: M2/M3 coverage in both windows rises to 32-35%, zero density errors.
KLAYOUT_FILLER_SCRIPT: dir::drc/filler/filler_deep.py

